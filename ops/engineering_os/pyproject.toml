[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gameflow-engineering-os"
version = "0.1.0"
description = "Read-only GameFlow Engineering OS MVP 0 monitor"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.7",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[project.scripts]
gfos = "gameflow_engineering_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gameflow_engineering_os = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]
