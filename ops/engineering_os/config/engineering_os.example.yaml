timezone: America/New_York

daily_brief:
  # Owner gate: leave disabled until Chase selects the daily generation time.
  enabled: false
  schedule: "08:00"
  retain_days: 90

events:
  enabled: true
  record_recovery: true
  repeat_after_hours: 24

web:
  bind_host: 127.0.0.1
  bind_port: 8765
  public_base_url: null
  stale_after_minutes: 20
  manual_refresh_enabled: false
  csrf_token: null

paths:
  kanban_db: /home/chase/.hermes/kanban/boards/gameflow/kanban.db
  kanban_backups: /home/chase/.hermes/backups/kanban/gameflow
  gameflow_repo: /home/chase/projects/GameFlowData
  state_dir: /home/chase/.local/state/gameflow-engineering-os
  log_dir: /home/chase/.local/state/gameflow-engineering-os/logs

commands:
  hermes: /home/chase/.local/bin/hermes
  systemctl: /usr/bin/systemctl
  tailscale: /usr/bin/tailscale
  git: /usr/bin/git
  df: /usr/bin/df
  du: /usr/bin/du

collector:
  timeout_seconds: 5

thresholds:
  backup_max_age_hours: 36
  stuck_task_minutes: 30
  disk_warning_percent: null
  disk_critical_percent: null
  artifact_growth_warning_bytes: null

systemd:
  gateway_service: hermes-gateway.service
  gbrain_service: gbrain-gameflow.service
  expected_timers:
    - gameflow-kanban-backup.timer
    - gbrain-nightly-sync-audit.timer
    - gameflow-agent-state-backup.timer
    - gbrain-weekly-code-source-refresh.timer
  timer_services:
    gameflow-kanban-backup.timer: gameflow-kanban-backup.service
    gbrain-nightly-sync-audit.timer: gbrain-nightly-sync-audit.service
    gameflow-agent-state-backup.timer: gameflow-agent-state-backup.service
    gbrain-weekly-code-source-refresh.timer: gbrain-weekly-code-source-refresh.service

disk:
  path: /

artifacts:
  directories:
    - /home/chase/projects/GameFlowData/src/models/artifacts
    - /home/chase/projects/GameFlowData/src/models/mlb/artifacts
    - /home/chase/projects/GameFlowData/backtest_results
    - /home/chase/projects/GameFlowData/graphify-out
