# Nixpacks configuration for Railway deployment
# Uses a venv to avoid writing to immutable Nix store

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "zlib", "stdenv.cc.cc.lib"]
# Copy libz.so.1 from nix store to a stable path — nix store hash changes on every
# rebuild so /root/.nix-profile/lib is unreliable at runtime.
cmds = [
    "mkdir -p /app/lib",
    "bash -c 'find /nix/store -name libz.so.1 -type f | head -1 | xargs -I{} cp {} /app/lib/'",
    "bash -c 'find /nix/store -name libstdc++.so.6 -type f | head -1 | xargs -I{} cp {} /app/lib/'",
    "bash -c 'find /nix/store -name libgcc_s.so.1 -type f | head -1 | xargs -I{} cp {} /app/lib/'"
]

[phases.install]
cmds = [
    "python3.11 -m venv --system-site-packages /app/venv",
    "/app/venv/bin/python -m pip install -r requirements.txt"
]

# /app/lib is baked into the image and stable across restarts
[variables]
LD_LIBRARY_PATH = "/app/lib:/root/.nix-profile/lib"

[start]
cmd = "/app/venv/bin/python src/orchestration/scheduler.py"
