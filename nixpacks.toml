# Nixpacks configuration for Railway deployment
# Uses a venv to avoid writing to immutable Nix store

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "zlib", "stdenv.cc.cc.lib"]
# Copy shared libs to /opt/lib — NOT /app/lib, because nixpacks runs
# COPY . /app as the final build step, which wipes /app/lib.
cmds = [
    "mkdir -p /opt/lib",
    "bash -c 'find /nix/store -name libz.so.1 -type f | head -1 | xargs -I{} cp {} /opt/lib/'",
    "bash -c 'find /nix/store -name libstdc++.so.6 -type f | head -1 | xargs -I{} cp {} /opt/lib/'",
    "bash -c 'find /nix/store -name libgcc_s.so.1 -type f | head -1 | xargs -I{} cp {} /opt/lib/'"
]

[phases.install]
cmds = [
    "python3.11 -m venv --system-site-packages /app/venv",
    "/app/venv/bin/python -m pip install -r requirements.txt"
]

# /opt/lib survives the COPY . /app step and is stable across restarts
[variables]
LD_LIBRARY_PATH = "/opt/lib:/root/.nix-profile/lib"

[start]
cmd = "/app/venv/bin/python src/orchestration/scheduler.py"
